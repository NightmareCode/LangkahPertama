<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05060a">
    <title>404 — Page Not Found | Langkah Pertama</title>
    <link rel="icon" href="/assets/icon-512.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at 50% 30%, rgba(217,176,108,0.12), transparent 60%),
                #05060a;
            color: #eef0f4;
        }
        .wrap { max-width: 460px; }
        .code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #d9b06c;
        }
        h1 {
            font-size: clamp(3.4rem, 16vw, 5.6rem);
            font-weight: 700;
            line-height: 1;
            margin: 14px 0 6px;
            background: linear-gradient(100deg, #f0d6a4, #d9b06c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        p { color: #9aa3b2; font-weight: 300; margin-bottom: 28px; }
        a.home {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            min-height: 44px;
            padding: 12px 24px;
            border-radius: 10px;
            background: linear-gradient(100deg, #f0d6a4, #d9b06c);
            color: #05060a;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.25s, box-shadow 0.25s;
        }
        a.home:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(217,176,108,0.3); }
        @media (prefers-reduced-motion: reduce) { a.home { transition: none; } }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="code">// Error 404 — Langkah Pertama</p>
        <h1>404</h1>
        <p>This page wandered off the map. Let's get you back to the studio.</p>
        <a class="home" href="/">← Back to Langkah Pertama</a>
    </div>
</body>
</html>
